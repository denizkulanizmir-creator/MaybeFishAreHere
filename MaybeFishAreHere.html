<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>MaybeFishAreHere</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #controls {
      background: #1e293b;
      padding: 15px;
      display: flex;
      gap: 25px;
      align-items: center;
      border-bottom: 3px solid #334155;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    select, input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }
    #info-panel {
      font-size: 14px;
      color: #38bdf8;
      max-width: 400px;
      line-height: 1.3;
    }
    #map-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle, #0284c7 0%, #0369a1 70%, #075985 100%);
      overflow: hidden;
    }
    .shore-label {
      position: absolute;
      font-size: 12px;
      font-weight: bold;
      color: rgba(255,255,255,0.3);
      padding: 5px;
    }
    .fish-school {
      position: absolute;
      width: 55px;
      height: 30px;
      background: rgba(254, 240, 138, 0.85);
      border: 2px solid #eab308;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px #facc15;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .fish-school::after {
      content: '🐟';
      font-size: 14px;
    }
    #fishing-float {
      position: absolute;
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.95);
      border: 3px dashed #ef4444;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: grab;
      box-shadow: 0 0 25px rgba(255, 255, 255, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #fishing-float:active {
      cursor: grabbing;
    }
    #fishing-float::after {
      content: '🎣';
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div id="controls">
    <div class="control-group">
      <label>💨 Rüzgarın Esiş Yönü (Nereden?)</label>
      <select id="wind-direction">
        <option value="Kuzey">Kuzey (Poyraz -> Güneye Eser)</option>
        <option value="Güney">Güney (Lodos -> Kuzeye Eser)</option>
        <option value="Doğu">Doğu (Gündoğusu -> Batıya Eser)</option>
        <option value="Batı">Batı (Günbatısı -> Doğuya Eser)</option>
      </select>
    </div>
    <div class="control-group">
      <label>⏰ Av Saati</label>
      <input type="time" id="fishing-time" value="06:30">
    </div>
    <div id="info-panel">
      <strong>Ekolojik Analiz:</strong> <span id="status-report">Hesaplanıyor...</span>
    </div>
  </div>

  <div id="map-container">
    <div class="shore-label" style="top: 5px; left: 50%; transform: translateX(-50%);">KUZEY KIYISI</div>
    <div class="shore-label" style="bottom: 5px; left: 50%; transform: translateX(-50%);">GÜNEY KIYISI</div>
    <div class="shore-label" style="top: 50%; left: 5px; transform: translateY(-50%);">BATI KIYISI</div>
    <div class="shore-label" style="top: 50%; right: 5px; transform: translateY(-50%);">DOĞU KIYISI</div>

    <div id="fishing-float" style="top: 50%; left: 50%;"></div>
  </div>

  <script>
    const mapContainer = document.getElementById('map-container');
    const floatElement = document.getElementById('fishing-float');
    const windSelect = document.getElementById('wind-direction');
    const timeInput = document.getElementById('fishing-time');
    const reportElement = document.getElementById('status-report');
    
    let activeDrag = false;
    let speechRunning = false;

    function calculateFisheryData() {
      document.querySelectorAll('.fish-school').forEach(el => el.remove());

      const selectedWind = windSelect.value;
      const selectedTime = timeInput.value;
      const currentHour = parseInt(selectedTime.split(':'));

      let primeTime = (currentHour >= 5 && currentHour <= 8) || (currentHour >= 18 && currentHour <= 21);
      let totalFish = primeTime ? 7 : 3;
      
      let hourMessage = primeTime ? "Eshor/Altın Saat! Balıklar kıyıda agresif besleniyor." : "Öğlen/Gece durağanlığı. Balık az ve derinde.";

      let boundary = { minX: 0.1, maxX: 0.9, minY: 0.1, maxY: 0.9 };
      let windMessage = "";

      if (selectedWind === 'Kuzey') {
        boundary.minY = 0.6; boundary.maxY = 0.95;
        windMessage = "Kuzey rüzgarı dalgaları ve yemleri Güney kıyısına yığıyor.";
      } else if (selectedWind === 'Güney') {
        boundary.minY = 0.05; boundary.maxY = 0.4;
        windMessage = "Lodos (Güney) rüzgârı balıkları beslenmek için Kuzey kıyısına çekiyor.";
      } else if (selectedWind === 'Doğu') {
        boundary.minX = 0.05; boundary.maxX = 0.4;
        windMessage = "Doğu rüzgarı akıntıyı Batı kıyısına yönlendiriyor.";
      } else if (selectedWind === 'Batı') {
        boundary.minX = 0.6; boundary.maxX = 0.95;
        windMessage = "Batı rüzgarı en verimli beslenme kuşağını Doğu kıyısında oluşturuyor.";
      }

      reportElement.innerHTML = `${windMessage} | ${hourMessage}`;

      for (let i = 0; i < totalFish; i++) {
        const fishElement = document.createElement('div');
        fishElement.className = 'fish-school';

        let coordinateX = boundary.minX + Math.random() * (boundary.maxX - boundary.minX);
        let coordinateY = boundary.minY + Math.random() * (boundary.maxY - boundary.minY);

        if (!primeTime) {
          coordinateX = (coordinateX + 0.5) / 2;
          coordinateY = (coordinateY + 0.5) / 2;
        }

        fishElement.style.left = (coordinateX * mapContainer.clientWidth) + 'px';
        fishElement.style.top = (coordinateY * mapContainer.clientHeight) + 'px';
        mapContainer.appendChild(fishElement);
      }
    }

    floatElement.addEventListener('mousedown', () => activeDrag = true);
    window.addEventListener('mouseup', () => activeDrag = false);

    window.addEventListener('mousemove', (event) => {
      if (!activeDrag) return;
      
      const area = mapContainer.getBoundingClientRect();
      let pointerX = event.clientX - area.left;
      let pointerY = event.clientY - area.top;

      if (pointerX < 22) pointerX = 22;
      if (pointerX > area.width - 22) pointerX = area.width - 22;
      if (pointerY < 22) pointerY = 22;
      if (pointerY > area.height - 22) pointerY = area.height - 22;

      floatElement.style.left = pointerX + 'px';
      floatElement.style.top = pointerY + 'px';

      detectProximity(pointerX, pointerY);
    });

    function detectProximity(currentX, currentY) {
      const targets = document.querySelectorAll('.fish-school');
      let isIntersecting = false;

      targets.forEach(target => {
        const targetX = parseFloat(target.style.left);
        const targetY = parseFloat(target.style.top);
        const distance = Math.hypot(currentX - targetX, currentY - targetY);

        if (distance < 40) {
          isIntersecting = true;
        }
      });

      if (isIntersecting && !speechRunning) {
        executeVoiceOutput();
      }
    }

    function executeVoiceOutput() {
      speechRunning = true;
      const narration = new SpeechSynthesisUtterance("balık. balık. balık. balık. balık.");
      narration.lang = "tr-TR";
      narration.rate = 1.1; 

      narration.onend = () => {
        setTimeout(() => {
          speechRunning = false;
          const currentPosition = floatElement.getBoundingClientRect();
          const areaOffset = mapContainer.getBoundingClientRect();
          detectProximity(currentPosition.left + 22 - areaOffset.left, currentPosition.top + 22 - areaOffset.top);
        }, 600);
      };

      window.speechSynthesis.speak(narration);
    }

    windSelect.addEventListener('change', calculateFisheryData);
    timeInput.addEventListener('change', calculateFisheryData);
    window.addEventListener('resize', calculateFisheryData);
    
    setTimeout(calculateFisheryData, 400);
  </script>
</body>
</html>
